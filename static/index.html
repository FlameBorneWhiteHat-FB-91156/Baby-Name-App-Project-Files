<!DOCTYPE html>
<html>
    
    
    <head>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Roboto&display=swap');

            body {
                font-family: "Arial", sans-serif;
                font-size: 16pt;
                color: #333333;
                background-color: #FEFEFE;
                margin: 40px auto;
                max-width: 800px;
            }
            
            input {
                font-size: 16pt;
            	padding: .25em .5em .25em .5em;
            	background-color: #FCFCFC;   
            }
        </style>
        
    </head>
    
    
    <body>
        
        <h1>Baby Name Popularity Tracker</h1>
        
        <figure class="highcharts-figure">
            <div id="container"></div>
        </figure>
        
        <label for="nameInputBox">Enter a name</label> <br>
        <input type="text" id="nameInputBox">

        <br><br>
        
        
        <input type="radio" id="female" name="sex" value="F" checked>
        <label for="female">Female</label><br>
        <input type="radio" id="male" name="sex" value="M">
        <label for="male">Male</label><br>
        
        <br>
        
        <input type="submit" id="button" value="Submit">
        
        <!-- JavaScript controls the page's behavior -->
        
<script>
document.getElementById('button').onclick = async function () {
    const name = document.getElementById('nameInputBox').value.trim();
    const sex = document.querySelector('input[name="sex"]:checked').value;

    if (!name) {
        alert('Please enter a name.');
        return;
    }

    try {
        const response = await fetch(
            '/submit?' + new URLSearchParams({name, sex})
        );
        if (!response.ok) throw new Error('Request failed');

        const result = await response.json();
        const points = result.data.map((rank, i) => [
            1910 + i,
            rank === null ? null : Number(rank)
        ]);

        Highcharts.chart('container', {
            chart: { type: 'line', height: 440 },
            title: { text: name + ' - Popularity by Year' },
            xAxis: {
                type: 'linear',
                title: { text: 'Year' }
            },
            yAxis: {
                reversed: true,
                title: { text: 'Rank (1 = most popular)' }
            },
            series: [{
                name: 'Popularity rank',
                data: points,
                color: '#2457d5',
                lineWidth: 3
            }],
            credits: { enabled: false }
        });
    } catch (error) {
        alert('Chart error: ' + error.message);
    }
};
</script>

        
        
        <!-- Highcharts for histograms -->
    	<script src="https://code.highcharts.com/highcharts.js"></script>

        
    </body>
    
    
</html>
